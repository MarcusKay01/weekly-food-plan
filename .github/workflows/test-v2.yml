name: Test Weekly Food Planner V2

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/test-v2.yml"
  push:
    branches:
      - v2-foundation
      - v2-app
    paths:
      - "v2/**"
      - ".github/workflows/test-v2.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest jsonschema
      - run: python -m pytest -q v2/tests
