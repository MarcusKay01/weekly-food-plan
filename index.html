<script>
const PLAN=JSON.parse(document.getElementById('plan-data').textContent);
let selectedMealId = PLAN.days.flatMap(d=>d.mealIds)[0] || null;
function showView(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));
  document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));
  window.scrollTo({top:0,behavior:'smooth'});
}
function meal(id){return PLAN.meals[id]}
function portions(m){
 const p=m.portions,b=[]; if(p.adultServings)b.push(p.adultServings+' adult'); if(p.childServings)b.push(p.childServings+' child'); return b.join(' + ');
}
function renderWeek(){
 document.getElementById('period').textContent=new Date(PLAN.period.startDate+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+new Date(PLAN.period.endDate+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
 document.getElementById('days').innerHTML=PLAN.days.map(d=>`<div class="card day"><div class="day-head"><h3>${d.dayName}</h3><span class="meta">${new Date(d.date+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div>`+
 (d.mealIds.length?d.mealIds.map(id=>{const m=meal(id);return `<button class="meal-select" onclick="selectMeal('${id}')"><div><strong>${m.title}</strong><small>${m.slotLabel?m.slotLabel+' · ':''}${portions(m)}</small></div><div class="arrow">›</div></button>`}).join(''):`<div class="empty">No meal currently planned.</div>`)+`</div>`).join('');
}
function selectMeal(id){selectedMealId=id;renderMeal();showView('meal')}
function renderMeal(){
 const box=document.getElementById('meal-focus');
 if(!selectedMealId||!meal(selectedMealId)){box.innerHTML='<div class="card focus-card">Select a meal from the week.</div>';return}
 const m=meal(selectedMealId);
 let h=`<div class="card focus-card"><div class="kicker">${m.slotLabel||'Meal'} · ${m.cuisine||''}</div><div class="focus-title">${m.title}</div><div class="meta">${new Date(m.date+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · ${portions(m)}</div>`;
 h+=`<div class="chips">${(m.portions.allocation||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div>`;
 if(m.arrangeForLunch) h+=`<div class="lunch-box"><b>Arrange for lunch</b>${m.arrangeForLunch.label}<br><span class="meta">${m.arrangeForLunch.instructions}</span></div>`;
 if(m.arrangedFromPreviousMeal) h+=`<div class="callout"><b>Prepared in advance</b><br>${m.arrangedFromPreviousMeal.label}.</div>`;
 if(m.ingredients) h+=`<div class="recipe-section"><h3>Ingredients</h3><ul>${m.ingredients.map(i=>`<li>${i.item} — ${i.quantity===null?'':i.quantity+' '}${i.unit}</li>`).join('')}</ul></div>`;
 h+=`<div class="recipe-section"><h3>Method</h3><ol>${m.method.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
 if(m.flavourNote) h+=`<div class="callout"><b>Flavour</b><br>${m.flavourNote}</div>`;
 if(m.barneyNote) h+=`<div class="callout"><b>Barney</b><br>${m.barneyNote}</div>`;
 if(m.storageNote) h+=`<div class="callout"><b>Storage / reheating</b><br>${m.storageNote}</div>`;
 h+='</div>'; box.innerHTML=h;
}
function renderShop(){
 const target=document.getElementById('shop-list');
 target.innerHTML=PLAN.shoppingList.map((x,i)=>`<label class="shop-item"><input type="checkbox" data-i="${i}"><span class="name">${x.item}</span><span class="qty">${x.quantity}</span></label>`).join('');
 const saved=JSON.parse(localStorage.getItem('foodplan-shop-v2')||'[]');
 document.querySelectorAll('.shop-item input').forEach(cb=>{cb.checked=saved.includes(+cb.dataset.i);cb.closest('.shop-item').classList.toggle('checked',cb.checked);cb.onchange=saveShop});
 updateProgress();
}
function saveShop(){const a=[...document.querySelectorAll('.shop-item input:checked')].map(x=>+x.dataset.i);localStorage.setItem('foodplan-shop-v2',JSON.stringify(a));document.querySelectorAll('.shop-item input').forEach(cb=>cb.closest('.shop-item').classList.toggle('checked',cb.checked));updateProgress()}
function updateProgress(){document.getElementById('progress').textContent=document.querySelectorAll('.shop-item input:checked').length+' / '+PLAN.shoppingList.length}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{if(b.dataset.view==='meal')renderMeal();showView(b.dataset.view)})
renderWeek();renderMeal();renderShop();
</script>
