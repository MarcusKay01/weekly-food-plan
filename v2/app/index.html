<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weekly Food Plan V2</title><style>:root{--ink:#18322c;--muted:#6a736e;--cream:#f7f2e8;--card:#fffdf8;--sage:#dfe9df;--line:#ded8cd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:20px}.hero{padding:22px 4px 10px}.hero h1{margin:4px 0}.muted{color:var(--muted);font-size:.9rem}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.weeknav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.weeknav .centre{text-align:center}.week-context{display:flex;justify-content:center;gap:6px;align-items:center;margin-bottom:6px}.week-label{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--sage);padding:4px 8px;border-radius:999px}.day h3{margin:0 0 10px}.day.today{outline:2px solid var(--ink);outline-offset:2px}.today-tag{font-size:.7rem;font-weight:800;margin-left:6px}.meal{border-top:1px solid var(--line);padding:12px 0}.meal:first-of-type{border-top:0}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}button,input{font:inherit}button{border:0;border-radius:12px;padding:9px 12px;font-weight:750;background:var(--sage);color:var(--ink)}button.primary{background:var(--ink);color:white}button:disabled{opacity:.35}.done{opacity:.58}.done .title{text-decoration:line-through}.pill{font-size:.72rem;background:var(--sage);padding:4px 8px;border-radius:999px}.login{margin-top:15vh}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:white}.hidden{display:none}.status{padding:10px 12px;border-radius:12px;background:var(--sage);margin:10px 0;font-size:.86rem}.shop label{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line)}nav{position:sticky;bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(247,242,232,.94);padding:8px;border-radius:16px}</style></head><body><div class="app"><section id="login" class="login card"><h1>Weekly Food Plan</h1><p class="muted">Sign in with the email linked to your household.</p><input id="email" type="email" autocomplete="email" placeholder="Email address"><button class="primary" id="sendLink">Send sign-in link</button><div id="loginStatus"></div></section><section id="main" class="hidden"><header class="hero"><div class="muted">Shared family menu · V2</div><h1>Weekly Food Plan</h1></header><div class="card weeknav"><button id="prevWeek" aria-label="Previous week">‹</button><div class="centre"><div class="week-context"><span id="weekLabel" class="week-label"></span></div><strong id="period"></strong><div><button id="todayWeek">Today</button></div></div><button id="nextWeek" aria-label="Next week">›</button></div><div id="message"></div><main id="week"></main><section id="shop" class="hidden"><h2>Shopping</h2><div class="card shop" id="shopList"></div></section><nav><button id="weekTab" class="primary">Week</button><button id="shopTab">Shop</button></nav></section></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './config.js';
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);let weeks=[],weekIndex=0,currentWeek=null,meals=[];
function note(t){$('message').innerHTML=t?`<div class="status">${t}</div>`:''}function fmt(d){return new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}function today(){return new Date().toISOString().slice(0,10)}
function weekContext(w){const t=today();if(w.start_date<=t&&w.end_date>=t)return'This week';if(w.end_date<t)return'Past week';return'Upcoming week'}
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session)return;$('login').classList.add('hidden');$('main').classList.remove('hidden');await loadWeeks();}
$('sendLink').onclick=async()=>{const email=$('email').value.trim();if(!email)return;const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href,shouldCreateUser:false}});$('loginStatus').innerHTML=`<div class="status">${error?error.message:'Check your email for the sign-in link.'}</div>`};
async function loadWeeks(){const {data:members,error}=await db.from('household_users').select('household_id').limit(1);if(error||!members?.length){note('Your account is signed in but is not linked to the household yet.');return}const hid=members[0].household_id;const r=await db.from('weeks').select('*').eq('household_id',hid).order('start_date',{ascending:true});if(r.error){note(r.error.message);return}weeks=r.data||[];if(!weeks.length){note('There are no V2 weeks yet.');return}const t=today();let i=weeks.findIndex(w=>w.start_date<=t&&w.end_date>=t);if(i<0)i=weeks.findIndex(w=>w.status==='current');weekIndex=i<0?weeks.length-1:i;await selectWeek(weekIndex)}
async function selectWeek(i){if(i<0||i>=weeks.length)return;weekIndex=i;currentWeek=weeks[i];note('');$('weekLabel').textContent=weekContext(currentWeek);$('period').textContent=`${fmt(currentWeek.start_date)} – ${fmt(currentWeek.end_date)}`;$('prevWeek').disabled=i===0;$('nextWeek').disabled=i===weeks.length-1;const t=today();const currentIndex=weeks.findIndex(w=>w.start_date<=t&&w.end_date>=t);$('todayWeek').disabled=currentIndex<0||currentIndex===i;const r=await db.from('meals').select('id,meal_key,meal_date,scheduled_date,slot,title,meal_mode,source_meal_id,execution_status').eq('week_id',currentWeek.id).order('scheduled_date').order('slot');if(r.error){note(r.error.message);return}meals=r.data||[];renderWeek();await renderShop()}
function editable(){return currentWeek?.status==='current'}
function renderWeek(){const by={};meals.forEach(m=>(by[m.scheduled_date]??=[]).push(m));const dates=[];for(let d=new Date(currentWeek.start_date+'T12:00');d<=new Date(currentWeek.end_date+'T12:00');d.setDate(d.getDate()+1))dates.push(d.toISOString().slice(0,10));const t=today();$('week').innerHTML=dates.map(date=>`<div class="card day ${date===t?'today':''}"><h3>${fmt(date)}${date===t?'<span class="today-tag">TODAY</span>':''}</h3>${(by[date]||[]).map(m=>`<div class="meal ${m.execution_status==='done'?'done':''}"><div class="row"><div><strong class="title">${m.title}</strong><div class="muted">${m.slot}${m.meal_mode==='planned_leftover'?' · linked lunch':''}</div></div><span class="pill">${m.execution_status}</span></div>${editable()?`<div class="actions">${m.execution_status==='upcoming'?`<button onclick="doneMeal('${m.id}')">✓ Done</button>${m.meal_mode!=='planned_leftover'?`<button onclick="moveMeal('${m.id}')">↔ Move</button>`:''}<button onclick="skipMeal('${m.id}')">Skip</button>`:`<button onclick="reopenMeal('${m.id}')">Reopen</button>`}</div>`:''}</div>`).join('')||'<div class="muted">No meals planned</div>'}</div>`).join('')}
async function statusMeal(id,status){const {error}=await db.rpc('set_meal_status',{target_meal_id:id,new_status:status,note:null});if(error)return note(error.message);await selectWeek(weekIndex)}window.doneMeal=id=>statusMeal(id,'done');window.skipMeal=id=>statusMeal(id,'skipped');window.reopenMeal=id=>statusMeal(id,'upcoming');window.moveMeal=async id=>{const m=meals.find(x=>x.id===id);const target=prompt(`Move ${m.title} to which date?`,m.scheduled_date);if(!target||target===m.scheduled_date)return;const {error}=await db.rpc('move_meal',{target_meal_id:id,target_date:target});if(error)return note(error.message);note('Meal moved. Any linked lunch moved with its source meal.');await selectWeek(weekIndex)};
async function renderShop(){const {data,error}=await db.from('shopping_items').select('id,name,quantity,unit,purchased').eq('week_id',currentWeek.id).order('name');if(error){note(error.message);return}$('shopList').innerHTML=(data||[]).map(x=>`<label><input type="checkbox" ${x.purchased?'checked':''} ${editable()?'':'disabled'} onchange="toggleShop('${x.id}',this.checked)"><span>${x.name}</span><span class="muted">${x.quantity} ${x.unit}</span></label>`).join('')||'<div class="muted">No shopping items.</div>'}window.toggleShop=async(id,v)=>{if(!editable())return;const {error}=await db.from('shopping_items').update({purchased:v,purchased_at:v?new Date().toISOString():null}).eq('id',id);if(error)note(error.message)};
$('prevWeek').onclick=()=>selectWeek(weekIndex-1);$('nextWeek').onclick=()=>selectWeek(weekIndex+1);$('todayWeek').onclick=()=>{const t=today();const i=weeks.findIndex(w=>w.start_date<=t&&w.end_date>=t);if(i>=0)selectWeek(i)};$('weekTab').onclick=()=>{$('week').classList.remove('hidden');$('shop').classList.add('hidden');$('weekTab').classList.add('primary');$('shopTab').classList.remove('primary')};$('shopTab').onclick=()=>{$('week').classList.add('hidden');$('shop').classList.remove('hidden');$('shopTab').classList.add('primary');$('weekTab').classList.remove('primary')};db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script></body></html>
